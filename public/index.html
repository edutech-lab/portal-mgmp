/* ===== KARTU ANGGOTA (8,56 : 5,39) - global agar bisa dicetak ===== */
.kd{position:relative;width:428px;height:269.5px;border-radius:14px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0147ac 0%,#001455 100%);font-family:'Plus Jakarta Sans',system-ui,sans-serif;box-shadow:0 12px 28px rgba(0,20,85,.28);flex:none;text-align:left}
.kd *{box-sizing:border-box}
.kd .k1{position:absolute;right:-70px;top:-60px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.06)}
.kd .k1:after{content:'';position:absolute;inset:60px;border-radius:50%;background:linear-gradient(135deg,rgba(254,211,3,.35),rgba(255,179,5,.05))}
.kd .k2{position:absolute;left:0;right:0;bottom:30px;height:4px;background:linear-gradient(90deg,#fed403,#ffb305)}
.kd .kt{position:absolute;left:0;right:0;top:0;height:56px;display:flex;gap:10px;align-items:center;padding:0 16px;background:rgba(0,20,85,.5);border-bottom:3px solid #fed403}
.kd .kt .kl{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 2px rgba(254,211,3,.9)}
.kd .kt .kl img{width:30px;height:30px;object-fit:contain}
.kd .kt .kn{flex:1;min-width:0}
.kd .kt .kn small{display:block;font-size:8px;font-weight:700;letter-spacing:2px;color:#fed403;line-height:1.2}
.kd .kt .kn b{display:block;font-size:15px;font-weight:800;letter-spacing:.8px;color:#fff;line-height:1.2;text-transform:uppercase}
.kd .kt .kn span{display:block;font-size:8.5px;opacity:.85;line-height:1.3}
.kd .kt .ky{flex:none;font-style:normal;font-size:9px;font-weight:800;color:#001455;background:linear-gradient(90deg,#fed403,#ffb305);border-radius:20px;padding:3px 10px;letter-spacing:.3px}
.kd .kb{position:absolute;left:16px;right:16px;top:68px;bottom:40px;display:flex;gap:12px;align-items:center}
.kd .kp{width:84px;height:108px;border-radius:10px;overflow:hidden;border:2.5px solid #fed403;background:#1b4aa0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:none}
.kd .kp img{width:100%;height:100%;object-fit:cover}
.kd .ki{flex:1;min-width:0}
.kd .ki h4{margin:0 0 4px;font-size:14.5px;line-height:1.2;font-weight:800}
.kd .ki dl{margin:0}
.kd .ki dt{font-size:8.5px;opacity:.7;text-transform:uppercase;letter-spacing:.6px;margin-top:5px}
.kd .ki dd{margin:0;font-size:11.5px;font-weight:700;word-break:break-all;line-height:1.25}
.kd .ki dd.as{word-break:normal;overflow-wrap:anywhere;font-size:10.5px;line-height:1.2}
.kd .kq{background:#fff;border-radius:8px;padding:5px;display:flex;align-items:center;justify-content:center;flex:none;color:#001455;font-size:9px}
.kd .kq.qr{width:84px;height:84px}
.kd .kq.bc{width:132px;height:64px}
.kd .kq svg{max-width:100%;height:auto}
.kd .kq img{max-width:100%}
.kd .kf{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:9.5px;font-weight:600;background:rgba(0,20,85,.55)}
#pa{display:none}
@media print{
 body>*:not(#pa){display:none!important}
 #pa{display:grid!important;grid-template-columns:repeat(2,85.6mm);gap:5mm;padding:10mm;background:#fff}
 #pa .kd{zoom:.7558;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 @page{size:A4;margin:0}
}

/* ===== APLIKASI ===== */
#mgmpApp{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;z-index:999999;font:14px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f1b3d;background:#f3f6fc;overflow:hidden;--b1:#0147ac;--b2:#001455;--y1:#fed403;--y2:#ffb305;--mu:#64718f;--bd:#e3e9f5;
 & *{box-sizing:border-box}
 & button,& input,& select,& textarea{font:inherit;color:inherit}
 & h1,& h2,& h3,& h4,& p{margin:0}
 & table{border-collapse:collapse}
 [hidden]{display:none!important}
 .mu{color:var(--mu)}
 .nw{white-space:nowrap}
 .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
 #mgmpRoot{position:relative;height:100%;width:100%;overflow:hidden}
 .app{display:flex;height:100%;min-height:0}
 .sb{width:262px;flex:none;background:linear-gradient(180deg,var(--b1),var(--b2));color:#fff;padding:18px 14px;display:flex;flex-direction:column;overflow:auto}
 .br{display:flex;gap:11px;align-items:center;padding:4px 6px 20px}
 .br img{width:48px;height:48px;object-fit:contain}
 .br b{display:block;font-size:13px;line-height:1.25}
 .br i{display:block;font-size:10.5px;opacity:.75;margin-top:3px}
 .nv a{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:6px;border-radius:12px;color:#dbe6ff;font-weight:600;cursor:pointer;transition:.2s}
 .nv a:hover{background:rgba(255,255,255,.12)}
 .nv a.on{background:linear-gradient(90deg,var(--y1),var(--y2));color:var(--b2);box-shadow:0 8px 18px rgba(254,211,3,.28)}
 .mn{flex:1;min-width:0;min-height:0;height:100%;display:flex;flex-direction:column}
 .hd{flex:none;height:68px;padding:0 22px;display:flex;align-items:center;gap:14px;color:#fff;background:linear-gradient(90deg,var(--b1),var(--b2))}
 .hd .tt{flex:1;min-width:0}
 .hd h1{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .hd small{opacity:.8;font-size:12px;white-space:nowrap}
 .hd .lm{display:none;width:38px;height:38px;object-fit:contain}
 .pvb{background:var(--y1);color:var(--b2);font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
 .usr{display:flex;align-items:center;gap:10px}
 .usr .nm{font-weight:700;font-size:13px;line-height:1.2;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .usr .nm small{display:block;font-weight:500}
 .lo{display:flex;gap:8px;align-items:center;border:0;background:linear-gradient(90deg,var(--y1),var(--y2));color:var(--b2);font-weight:700;padding:9px 14px;border-radius:12px;cursor:pointer}
 .ct{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 22px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
 .ft{flex:none;background:linear-gradient(90deg,var(--b2),var(--b1));color:#cfe0ff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:10px 22px calc(10px + env(safe-area-inset-bottom,0px));font-size:11.5px;line-height:1.35}
 .ft b{color:#fff;display:block}
 .ft .l{display:flex;gap:10px;align-items:center;min-width:0}
 .ft .c{text-align:center}
 .ft .r{text-align:right}
 .ft.m{display:none}
 .ft img{width:32px;height:32px;object-fit:contain}
 .bn,.pop{display:none}
 .bnr{position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;border-radius:20px;padding:26px 30px;color:#fff;overflow:hidden;background:linear-gradient(120deg,#0147ac 0%,#001455 100%);box-shadow:0 14px 34px rgba(1,71,172,.25);margin-bottom:18px}
 .bnr:before{content:'';position:absolute;right:-80px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(254,211,3,.3),transparent 70%)}
 .bt{position:relative;max-width:520px}
 .bt small{font-weight:700;letter-spacing:1.5px;color:var(--y1);font-size:11px}
 .bt h2{font-size:28px;line-height:1.15;font-weight:800;margin:6px 0 8px}
 .bt h2 span{background:linear-gradient(90deg,var(--y1),var(--y2));-webkit-background-clip:text;background-clip:text;color:transparent}
 .bt p{opacity:.88;margin-bottom:14px;font-size:13px}
 .bnr .il{position:relative;width:210px;flex:none}
 .bf{position:relative;display:grid;gap:14px;flex:none}
 .bf div{display:flex;gap:12px;align-items:center;font-weight:600;font-size:13px}
 .bf .ic{width:30px;height:30px;color:var(--y1)}
 .sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
 .st{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border:1px solid var(--bd);box-shadow:0 6px 20px rgba(0,20,85,.05)}
 .st .bb{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
 .bb.b{background:linear-gradient(135deg,#2f7bf0,#0147ac)}.bb.g{background:linear-gradient(135deg,#34d399,#059669)}.bb.p{background:linear-gradient(135deg,#a78bfa,#7c3aed)}.bb.y{background:linear-gradient(135deg,#fed403,#ffb305);color:#001455}.bb.c{background:linear-gradient(135deg,#38bdf8,#0284c7)}.bb.r{background:linear-gradient(135deg,#f87171,#dc2626)}
 .st small{color:var(--mu);font-weight:600;font-size:12px}
 .st b{display:block;font-size:24px;line-height:1.2}
 .st span{font-size:11px;color:var(--mu)}
 .gr{display:grid;gap:14px;margin-bottom:14px;grid-template-columns:1.5fr 1fr 1.2fr}
 .gr.two{grid-template-columns:1fr 1fr}
 .cc{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(0,20,85,.05);min-width:0}
 .cc h3{font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:12px;color:var(--b2)}
 .cc h3 .ic{color:var(--b1);width:18px;height:18px}
 .ch{position:relative;height:210px}
 .dn{display:flex;align-items:center;gap:14px}
 .dn .ch{width:150px;height:150px;flex:none}
 .lgd{list-style:none;margin:0;padding:0;flex:1;font-size:12.5px}
 .lgd li{display:flex;align-items:center;gap:8px;padding:4px 0}
 .lgd i{width:10px;height:10px;border-radius:50%}
 .lgd b{margin-left:auto}
 .ls{display:grid;gap:10px}
 .it{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:#f6f9ff}
 .dt{width:48px;text-align:center;border-radius:12px;padding:6px 0;color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2));flex:none}
 .dt b{display:block;font-size:18px;line-height:1}
 .dt small{font-size:10px;text-transform:uppercase}
 .it .tx{flex:1;min-width:0}
 .it .tx b{display:block;font-size:13px}
 .it .tx small{color:var(--mu);font-size:11.5px}
 .it .ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:var(--b1);flex:none}
 .em{text-align:center;color:var(--mu);padding:24px 10px;font-size:13px}
 .tb{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
 .tb .ac{display:flex;gap:8px;flex-wrap:wrap}
 .sr{max-width:320px;flex:1;min-width:200px}
 .tbw{padding:0;overflow:auto}
 .tbw table{width:100%;min-width:720px}
 .tbw th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);padding:12px 14px;background:#f6f9ff;white-space:nowrap}
 .tbw td{padding:11px 14px;border-top:1px solid var(--bd);vertical-align:middle}
 .tbw tr:hover td{background:#fafcff}
 .av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
 .bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
 .bd.ok{background:#dcfce7;color:#15803d}.bd.wn{background:#fff3c4;color:#8a6500}.bd.in{background:#dbeafe;color:#1d4ed8}.bd.er{background:#fee2e2;color:#b91c1c}.bd.mu{background:#eef2f9;color:#64718f}
 .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--b1),var(--b2));color:#fff;transition:.2s;white-space:nowrap}
 .btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
 .btn.y{background:linear-gradient(90deg,var(--y1),var(--y2));color:var(--b2)}
 .btn.o{background:#fff;color:var(--b1);border:1px solid #cdd9f3}
 .btn.r{background:#fee2e2;color:#b91c1c}
 .btn.sm{padding:6px 10px;border-radius:9px;font-size:12px}
 .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
 .in{width:100%;border:1px solid #d5def2;background:#fff;border-radius:12px;padding:11px 14px;outline:0}
 .in:focus{border-color:var(--b1);box-shadow:0 0 0 3px rgba(1,71,172,.12)}
 .in[readonly]{background:#f3f6fc}
 textarea.in{resize:vertical;min-height:84px}
 .fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .fg .f{display:flex;flex-direction:column;gap:5px;min-width:0}
 .fg .f.w{grid-column:1/-1}
 .f label{font-size:12px;font-weight:700;color:#3a4a73}
 .f small{font-size:11.5px}
 .mdl{position:absolute;inset:0;z-index:20;background:rgba(0,20,85,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px}
 .mb{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:94%;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
 .mb.w{max-width:760px}
 .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);color:var(--b2);font-size:16px}
 .mh .x{border:0;background:#eef2f9;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
 .mbd{padding:18px 20px;overflow:auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
 .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
 #ld{position:absolute;inset:0;z-index:50;background:rgba(244,247,252,.8);backdrop-filter:blur(5px);display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--b2)}
 #ld.on{display:flex}
 .sp{width:52px;height:52px;border-radius:50%;border:5px solid #d6e2fa;border-top-color:var(--b1);border-right-color:var(--y2);animation:spn .8s linear infinite}
 @keyframes spn{to{transform:rotate(360deg)}}
 #tsts{position:absolute;top:76px;right:16px;z-index:60;display:grid;gap:8px;max-width:min(360px,calc(100% - 32px))}
 .tst{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:#fff;box-shadow:0 12px 30px rgba(0,20,85,.2);border-left:5px solid #16a34a;font-weight:600;animation:sl .3s}
 .tst .ic{color:#16a34a}
 .tst.er{border-color:#dc2626}.tst.er .ic{color:#dc2626}
 @keyframes sl{from{transform:translateX(30px);opacity:0}}
 .cfm{position:absolute;inset:0;z-index:70;background:rgba(0,20,85,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;animation:cfi .18s}
 .cfb{width:100%;max-width:400px;background:#fff;border-radius:22px;padding:28px 24px 22px;text-align:center;box-shadow:0 30px 80px rgba(0,20,85,.35);border-top:5px solid var(--y1);animation:cfp .24s cubic-bezier(.2,.9,.3,1.2)}
 .cfi{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#e6efff;color:var(--b1)}
 .cfi .ic{width:30px;height:30px}
 .cfb h3{margin:0 0 8px;font-size:19px;color:var(--b2)}
 .cfb p{margin:0;color:var(--mu);font-size:14px;line-height:1.6}
 .cfa{display:flex;gap:10px;margin-top:24px}
 .cfa .btn{flex:1;height:46px}
 .cfb.dg{border-top-color:#dc2626}
 .cfb.dg .cfi{background:#fee2e2;color:#dc2626}
 .cfb.dg .btn.ok{background:linear-gradient(90deg,#ef4444,#b91c1c);color:#fff}
 @keyframes cfi{from{opacity:0}}
 @keyframes cfp{from{transform:scale(.92) translateY(10px);opacity:0}}
 .lgn{position:absolute;inset:0;overflow:auto;display:flex;padding:28px;background:radial-gradient(circle at 92% 6%,rgba(254,211,3,.2),transparent 24%),linear-gradient(135deg,#0147ac 0%,#00278a 50%,#001455 100%);color:#fff}
 .lgw{zoom:.8;display:flex;width:100%;max-width:1100px;min-height:600px;margin:auto;border-radius:40px;overflow:hidden;border:1px solid rgba(255,255,255,.4);box-shadow:0 30px 80px rgba(0,10,60,.45)}
 .lgl{flex:1.05;min-width:0;display:flex;flex-direction:column;padding:44px 40px 36px;background:linear-gradient(180deg,#164fa4,#12448f)}
 .lgo{width:86px;height:86px;border-radius:20px;background:#fff;display:grid;place-items:center;padding:8px;margin-bottom:26px;flex:none}
 .lgo img{width:100%;height:100%;object-fit:contain}
 .lgl h1{font-size:38px;line-height:1.1;font-weight:800;letter-spacing:-.5px}
 .lgl .sch{display:block;margin-top:14px;font-size:17px;font-weight:700;color:var(--y1)}
 .lgl .ta{display:block;margin-top:4px;font-size:15px}
 .lgl p{margin-top:18px;opacity:.92;line-height:1.55;font-size:15px}
 .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
 .chips span{display:flex;gap:8px;align-items:center;padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);font-weight:600;font-size:13px}
 .il2{display:block;width:100%;max-width:330px;margin-top:auto;padding-top:20px}
 @supports not (zoom:.8){.lgw{max-width:880px;min-height:480px}}
 .lgr{flex:1;min-width:0;background:#fff;color:var(--b2);padding:40px 44px;display:flex;flex-direction:column;justify-content:center}
 .lgr h2{font-size:26px;font-weight:800}
 .lgr .sub{color:var(--mu);font-size:13px;margin:6px 0 22px}
 .lgr form>.f{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
 .lgr .f label{color:var(--b2);font-size:13px}
 .lgr .in{height:46px}
 .lgr .in:focus{border-color:var(--b1);box-shadow:0 0 0 3px rgba(1,71,172,.16)}
 .lgr .pw .in{padding-right:44px}
 .lgr .btn{height:48px;box-shadow:0 8px 20px rgba(254,211,3,.35)}
 .seg{display:grid;grid-template-columns:1fr 1fr;background:#eef2f9;border-radius:16px;padding:5px;margin:0 0 28px}
 .seg button{border:0;background:transparent;padding:11px;border-radius:12px;font-weight:700;cursor:pointer;color:var(--mu)}
 .seg button.on{background:#fff;color:var(--b1);box-shadow:0 2px 8px rgba(0,20,85,.12)}
 .pvx{margin-top:16px;border:1.5px dashed #9db8ec;background:#eef4ff;border-radius:14px;padding:12px;font-size:12.5px;color:#1e3a8a}
 .pvx div{display:flex;gap:8px;margin-top:8px}
 .pw{position:relative}
 .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--mu);display:grid}
 .pg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
 .cam{position:relative;border-radius:16px;overflow:hidden;background:#001455;aspect-ratio:4/3}
 .cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
 .cam .rg{position:absolute;inset:10% 25%;border:3px dashed rgba(254,211,3,.9);border-radius:50%}
 .chp{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#f6f9ff;margin-bottom:8px;font-weight:600;font-size:13px}

const GMSG = c => c === 1 ? 'Izin lokasi ditolak. Izinkan akses lokasi untuk situs ini di pengaturan browser, lalu tekan "Coba Lagi".'

function setPos(x, coarse) {
  if (coarse && S.pos) return;

function geoStart(auto) {

  if (S.geo != null && g) { g.clearWatch(S.geo); S.geo = null }
  if (!auto) S.gerr = ''; S.gslow = false;
  if (!g) { S.gerr = 'Browser ini tidak mendukung lokasi. Buka aplikasi lewat Chrome atau Safari.'; return updPres() }
  if (window.isSecureContext === false) { S.gerr = 'Lokasi hanya dapat diakses melalui alamat HTTPS.'; return updPres() }
  const fail = e => { if (S.pos) return; S.gerr = GMSG(e.code); updPres(); if (e.code !== 1 && (S.gtry = (S.gtry || 0) + 1) <= 3) S.gr = setTimeout(() => geoStart(1), 6000) };

const BK_APP = 'portal-mgmp-informatika', BK_FORMAT = 1, BK_PAGE = 1000, BK_CHUNK = 200;
// Urutan induk -> anak (sesuai relasi). Restore berjalan dari atas ke bawah, penghapusan dari bawah ke atas.
const BK_TABLES = ['pengaturan', 'anggota', 'pertemuan', 'presensi', 'ketidakhadiran', 'konten'];
const BK_LABEL = { pengaturan: 'Pengaturan aplikasi', anggota: 'Data anggota', pertemuan: 'Pertemuan', presensi: 'Presensi', ketidakhadiran: 'Ketidakhadiran', konten: 'Konten pembelajaran' };

const bkCard = () => `<div class="cc" style="max-width:720px;margin-top:16px"><h3>${ic('folder')}Backup & Restore Database</h3>

  <div class="f"><label style="font-weight:700;font-size:13px">Pulihkan dari File Backup</label><input class="in" type="file" id="rsFile" accept=".json,application/json" data-chg="rsPick"></div>
  <div id="rsBox"></div>
  <p class="mu" style="margin:14px 0 0;font-size:12px;line-height:1.6">${ic('alert')} File backup berisi data pribadi anggota (termasuk username, password, dan data wajah). Simpan di tempat aman dan jangan dibagikan.</p></div>`;

// Ambil seluruh baris sebuah tabel (Supabase membatasi hasil per permintaan, jadi diambil per halaman)
async function bkFetch(t, cols = '*') {
  if (IS_PREVIEW) return (mem[t] || []).map(r => ({ ...r }));
  const out = [];
  for (let from = 0; ; ) {
    const { data, error } = await sb.from(t).select(cols).order('id', { ascending: true }).range(from, from + BK_PAGE - 1);
    if (error) throw error;
    if (!data || !data.length) break;
    out.push(...data); from += data.length;
  }
  return out;
}
async function bkBuild() {
  const tabel = {}, jumlah = {};
  for (const t of BK_TABLES) { tabel[t] = await bkFetch(t); jumlah[t] = tabel[t].length }
  return { app: BK_APP, format: BK_FORMAT, dibuat: new Date().toISOString(), dibuat_oleh: S.user?.email || 'admin', nama_aplikasi: S.set.nama_aplikasi, jumlah, tabel };
}
function bkSave(b, prefix = 'backup-portal-mgmp') {
  const d = new Date(), name = `${prefix}-${fmtD(d)}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(b)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); return name;
}
function bkParse(txt) {
  let b; try { b = JSON.parse(txt) } catch { throw new Error('File bukan JSON yang valid.') }
  if (!b || b.app !== BK_APP || !b.tabel || typeof b.tabel !== 'object') throw new Error('File ini bukan file backup Portal MGMP Informatika.');
  if (+b.format !== BK_FORMAT) throw new Error('Versi format file backup tidak didukung.');
  const tabel = {};
  for (const t of BK_TABLES) {
    const rows = b.tabel[t]; if (!Array.isArray(rows)) throw new Error(`Data "${BK_LABEL[t]}" tidak ditemukan di file backup.`);
    const seen = new Set();
    rows.forEach((r, i) => {
      if (!r || typeof r !== 'object' || Array.isArray(r) || r.id == null) throw new Error(`Baris ke-${i + 1} pada "${BK_LABEL[t]}" tidak memiliki id.`);
      if (seen.has(String(r.id))) throw new Error(`Terdapat id ganda pada "${BK_LABEL[t]}" di file backup.`);
      seen.add(String(r.id));
    });
    tabel[t] = rows;
  }
  return { dibuat: b.dibuat, tabel };
}
async function bkUp(t, rows) { for (let i = 0; i < rows.length; i += BK_CHUNK) await DB.up(t, rows.slice(i, i + BK_CHUNK), 'id') }
async function bkDelExtra(t, keep) {
  const ids = (await bkFetch(t, 'id')).map(r => r.id).filter(id => !keep.has(String(id)));
  if (!ids.length) return;
  if (IS_PREVIEW) { mem[t] = mem[t].filter(r => !ids.includes(r.id)); return }
  for (let i = 0; i < ids.length; i += 100) { const { error } = await sb.from(t).delete().in('id', ids.slice(i, i + 100)); if (error) throw error }
}
async function bkRestore(b, mode) {
  let cur = '';
  try {
    if (mode === 'replace') for (const t of [...BK_TABLES].reverse()) { if (t === 'pengaturan') continue; cur = BK_LABEL[t]; await bkDelExtra(t, new Set(b.tabel[t].map(r => String(r.id)))) }
    for (const t of BK_TABLES) { cur = BK_LABEL[t]; await bkUp(t, b.tabel[t]) }
  } catch (e) { e.message = `Pemulihan berhenti pada "${cur}": ${msg(e)} File backup pengaman sudah terunduh; perbaiki masalahnya lalu ulangi.`; throw e }
}

};

    const dt = b.dibuat ? new Date(b.dibuat) : null, tm = dt && !isNaN(dt) ? `${tgl(fmtD(dt))} ${pad(dt.getHours())}:${pad(dt.getMinutes())}` : '-';
    const radio = (v, ck, ttl, ds) => `<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;cursor:pointer"><input type="radio" name="rsm" value="${v}" ${ck ? 'checked' : ''} style="margin-top:3px"><span><b>${ttl}</b><br><small class="mu">${ds}</small></span></label>`;
    box.innerHTML = `<p class="mu" style="margin:14px 0 8px;font-size:12.5px">Backup dibuat: <b>${h(tm)}</b></p>
    <div class="tbw" style="border:1px solid var(--bd);border-radius:12px"><table style="min-width:0"><thead><tr><th>Data</th><th>Di file backup</th><th>Saat ini</th></tr></thead><tbody>${BK_TABLES.map(k => `<tr><td>${h(BK_LABEL[k])}</td><td>${b.tabel[k].length}</td><td>${bkNow(k)}</td></tr>`).join('')}</tbody></table></div>
    <div style="display:grid;gap:8px;margin-top:12px">${radio('merge', true, 'Gabungkan (disarankan)', 'Menambah data yang belum ada dan memperbarui data dengan id yang sama. Data lain di database tidak dihapus.')}${radio('replace', false, 'Ganti total', 'Database dibuat sama persis dengan file backup. Data yang tidak ada di file backup dihapus permanen.')}</div>
    <div class="mf" style="justify-content:flex-start"><button type="button" class="btn r" data-act="rsRun">${ic('upload')}Pulihkan Data</button></div>`;
  } catch (e) { t.value = ''; throw e }
};
A.rsRun = async () => {
  const b = S.rs; if (!b) throw new Error('Pilih file backup terlebih dahulu.');
  const mode = $('input[name=rsm]:checked')?.value === 'replace' ? 'replace' : 'merge', rep = mode === 'replace';
  if (!await confirmBox({
    title: rep ? 'Ganti Seluruh Data?' : 'Pulihkan Data dari Backup?', icon: 'upload', danger: rep, ok: 'Ya, Pulihkan',
    msg: rep ? 'Data yang tidak ada di file backup akan dihapus permanen dan data lain ditimpa isi backup. Sebelum dimulai, backup pengaman data saat ini akan diunduh otomatis.' : 'Data dengan id yang sama akan ditimpa isi file backup. Sebelum dimulai, backup pengaman data saat ini akan diunduh otomatis.'
  })) return;
  await busy(async () => { bkSave(await bkBuild(), 'pengaman-sebelum-restore'); await bkRestore(b, mode) }, 'Memulihkan data…');
  S.rs = null; await busy(loadAll, 'Memuat data…'); root.innerHTML = shell(); go('set'); snd(1); toast('Data berhasil dipulihkan dari backup');
};

A.enroll = () => {
  modal('Rekam Wajah', `<div class="cam"><video id="ev" autoplay playsinline muted></video><div class="rg"></div></div><p class="mu" style="margin-top:10px">Hadapkan wajah ke kamera dengan pencahayaan cukup, lalu tekan Rekam.</p><div class="mf"><button class="btn o" data-act="mclose">Batal</button><button class="btn y" data-act="enrollGo">${ic('camera')}Rekam</button></div>`);
  cam($('#ev')).catch(() => { closeM(); toast('Kamera tidak dapat diakses. Izinkan akses kamera.', 'er') });
};
A.enrollGo = async () => {
  const v = $('#ev'); if (!v) return; const r = await busy(() => detect(v), 'Mendeteksi wajah…');
  if (!r) { snd(0); return toast('Wajah tidak terdeteksi. Coba lagi.', 'er') }
  await busy(() => DB.set('anggota', S.user.id, { face_descriptor: Array.from(r.descriptor) })); closeM(); await loadAll(); go('set'); snd(1); toast('Wajah berhasil direkam');
};

// ---------- KONTEN (DATA KONTEN & GALERI) ----------
const JENIS = ['Permainan Aktif', 'Media Belajar', 'Video Pembelajaran', 'Bahan Ajar', 'E-Book', 'Info Grafis', 'Augmented Reality (AR)', 'Artikel', 'Lainnya'];
const MAPEL = ['Informatika', 'Koding dan Kecerdasan Artifisial (KKA)'], KLS = [7, 8, 9];
const kOwn = k => S.role === 'admin' || (!!k.anggota_id && k.anggota_id === S.user.id);
const knm = k => S.anggota.find(x => x.id === k.anggota_id)?.nama_lengkap || k.nama_kontributor || 'Administrator';
const kSort = () => [...S.konten].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
const okUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const mpBd = m => `<span class="bd ${m === MAPEL[0] ? 'ok' : 'wn'}">${m === MAPEL[0] ? 'Informatika' : 'KKA'}</span>`;
const topK = () => { const m = new Map(); S.konten.forEach(k => { if (!k.anggota_id) return; const e = m.get(k.anggota_id) || { n: 0, nama: knm(k) }; e.n++; m.set(k.anggota_id, e) }); return [...m.values()].sort((a, b) => b.n - a.n || a.nama.localeCompare(b.nama)).slice(0, 5) };
const kLink = k => `<a class="btn sm o" href="${h(okUrl(k.link))}" target="_blank" rel="noopener noreferrer">${ic('link')}Buka</a>`;

PG.konten = () => {
  const adm = S.role === 'admin', l = kSort().filter(kOwn);
  const rows = l.map((k, i) => `<tr data-s="${h([k.judul, k.jenis_konten, k.mapel, 'kelas ' + k.kelas, adm ? knm(k) : ''].join(' ')).toLowerCase()}"><td>${i + 1}</td><td style="min-width:220px"><b>${h(k.judul)}</b><br><small class="mu">${h((k.deskripsi || '').slice(0, 90))}${(k.deskripsi || '').length > 90 ? '…' : ''}</small></td><td>${h(k.jenis_konten)}</td><td>${h(k.mapel)}</td><td class="nw">Kelas ${k.kelas}</td>${adm ? `<td>${h(knm(k))}</td>` : ''}<td class="nw">${tgl(k.created_at)}</td><td>${kLink(k)}</td><td class="nw"><button class="btn sm o" data-act="kEdit" data-id="${k.id}">${ic('edit')}</button> <button class="btn sm r" data-act="kDel" data-id="${k.id}">${ic('trash')}</button></td></tr>`).join('');
  return `<div class="tb"><input class="in sr" data-filter placeholder="Cari judul, jenis, mapel…"><div class="ac"><button class="btn y" data-act="kAdd">${ic('plus')}Tambah Konten</button></div></div>
  <p class="mu" style="margin:0 0 12px;font-size:12.5px">${adm ? 'Sebagai admin, Anda dapat mengelola seluruh konten anggota.' : 'Anda hanya dapat mengelola konten yang Anda input sendiri. Seluruh konten tampil di Galeri Konten.'}</p>
  <div class="cc tbw"><table><thead><tr><th>No</th><th>Judul</th><th>Jenis Konten</th><th>Mata Pelajaran</th><th>Kelas</th>${adm ? '<th>Kontributor</th>' : ''}<th>Diinput</th><th>Link</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="${adm ? 9 : 8}">${empty('Belum ada konten. Tekan "Tambah Konten" untuk membagikan konten pembelajaran.')}</td></tr>`}</tbody></table></div>`;
};
function kForm(k) {
  const n = !k; k = k || {};
  modal(n ? 'Tambah Konten' : 'Ubah Konten', `<form id="fk"><input type="hidden" name="id" value="${k.id || ''}"><div class="fg">
  <div class="f w"><label>Judul *</label><input class="in" name="judul" required maxlength="200" value="${h(k.judul || '')}"></div>
  <div class="f w"><label>Jenis Konten *</label><select class="in" name="jenis_konten" required>${JENIS.map(j => `<option ${k.jenis_konten === j ? 'selected' : ''}>${h(j)}</option>`).join('')}</select></div>
  <div class="f"><label>Mata Pelajaran *</label><select class="in" name="mapel" required>${MAPEL.map(m => `<option ${k.mapel === m ? 'selected' : ''}>${h(m)}</option>`).join('')}</select></div>
  <div class="f"><label>Kelas *</label><select class="in" name="kelas" required>${KLS.map(c => `<option value="${c}" ${+k.kelas === c ? 'selected' : ''}>Kelas ${c}</option>`).join('')}</select></div>
  <div class="f w"><label>Deskripsi Materi *</label><textarea class="in" name="deskripsi" required placeholder="Jelaskan singkat materi atau isi konten">${h(k.deskripsi || '')}</textarea></div>
  <div class="f w"><label>Link Konten *</label><input class="in" name="link" required inputmode="url" placeholder="https://..." value="${h(k.link || '')}"><small class="mu">Tautan ke Google Drive, YouTube, Canva, atau situs lainnya.</small></div></div>
  <div class="mf"><button type="button" class="btn o" data-act="mclose">Batal</button><button class="btn">Simpan</button></div></form>`);
}
FM.fk = async f => {
  const d = fd(f); let u = d.link.trim(); if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  let ok = false; try { const x = new URL(u); ok = /^https?:$/.test(x.protocol) && x.hostname.includes('.') } catch { }
  if (!ok) throw new Error('Link konten tidak valid. Gunakan alamat yang diawali http:// atau https://.');
  if (!JENIS.includes(d.jenis_konten) || !MAPEL.includes(d.mapel) || !KLS.includes(+d.kelas)) throw new Error('Pilihan jenis konten, mata pelajaran, atau kelas tidak valid.');
  const row = { judul: d.judul.trim(), jenis_konten: d.jenis_konten, mapel: d.mapel, kelas: +d.kelas, deskripsi: d.deskripsi.trim(), link: u };
  if (d.id) { const k = S.konten.find(x => x.id === d.id); if (!k || !kOwn(k)) throw new Error('Anda tidak memiliki akses untuk mengubah konten ini.'); await DB.set('konten', d.id, row) }
  else { const adm = S.role === 'admin'; await DB.add('konten', { ...row, anggota_id: adm ? null : S.user.id, nama_kontributor: adm ? 'Administrator' : S.user.nama_lengkap, asal_sekolah: adm ? null : (S.user.asal_sekolah || null) }) }
  closeM(); await loadAll(); go(S.page); toast('Konten tersimpan');
};
A.kAdd = () => kForm();
A.kEdit = d => { const k = S.konten.find(x => x.id === d.id); if (!k || !kOwn(k)) throw new Error('Anda tidak memiliki akses untuk mengubah konten ini.'); kForm(k) };
A.kDel = async d => {
  const k = S.konten.find(x => x.id === d.id); if (!k || !kOwn(k)) throw new Error('Anda tidak memiliki akses untuk menghapus konten ini.');
  if (!await confirmBox({ title: 'Hapus Konten?', msg: `Konten "${k.judul}" akan dihapus permanen dan tidak dapat dikembalikan.`, ok: 'Ya, Hapus', danger: true })) return;
  await busy(() => DB.del('konten', d.id), 'Menghapus…'); await reload(); toast('Konten dihapus');
};

const JM = { 'Permainan Aktif': ['#7c3aed', '#a78bfa', 'target'], 'Media Belajar': ['#0147ac', '#3b82f6', 'book'], 'Video Pembelajaran': ['#dc2626', '#f87171', 'play'], 'Bahan Ajar': ['#059669', '#34d399', 'file'], 'E-Book': ['#0284c7', '#38bdf8', 'book'], 'Info Grafis': ['#d97706', '#fbbf24', 'chart'], 'Augmented Reality (AR)': ['#0891b2', '#22d3ee', 'cube'], 'Artikel': ['#475569', '#94a3b8', 'edit'], 'Lainnya': ['#64748b', '#94a3b8', 'folder'] };
PG.galeri = () => {
  const g = S.gf, all = kSort(), base = all.filter(k => (!g.mapel || k.mapel === g.mapel) && (!g.kelas || String(k.kelas) === g.kelas)), l = base.filter(k => !g.jenis || k.jenis_konten === g.jenis);
  const sel = (n, lbl, opts) => `<select class="in" data-chg="gf" data-k="${n}"><option value="">${lbl}</option>${opts.map(o => `<option value="${h(o[0])}" ${g[n] === String(o[0]) ? 'selected' : ''}>${h(o[1])}</option>`).join('')}</select>`;
  const chips = `<div class="jc"><button type="button" class="${g.jenis ? '' : 'on'}" data-act="gj" data-v="">Semua<i>${base.length}</i></button>${JENIS.map(j => `<button type="button" class="${g.jenis === j ? 'on' : ''}" data-act="gj" data-v="${h(j)}">${h(j)}<i>${base.filter(k => k.jenis_konten === j).length}</i></button>`).join('')}</div>`;
  const kon = new Set(all.map(k => k.anggota_id).filter(Boolean)).size, jn = new Set(all.map(k => k.jenis_konten)).size;
  const cards = l.map(k => { const a = S.anggota.find(x => x.id === k.anggota_id) || { nama_lengkap: knm(k) }, m = JM[k.jenis_konten] || JM.Lainnya;
    return `<div class="kc" style="--c1:${m[0]};--c2:${m[1]}" data-s="${h([k.judul, k.deskripsi, k.jenis_konten, k.mapel, 'kelas ' + k.kelas, knm(k), k.asal_sekolah].join(' ')).toLowerCase()}"><div class="kv">${ic(m[2], 'gi')}<div class="r1"><span class="it2">${ic(m[2])}</span><span class="kls">Kelas ${k.kelas}</span></div><span class="kj">${h(k.jenis_konten)}</span></div><div class="kbd"><div>${mpBd(k.mapel)}</div><h4>${h(k.judul)}</h4><div class="kx">${h(k.deskripsi)}</div></div><div class="kw">${av(a)}<div style="min-width:0"><b>${h(knm(k))}</b>${h(k.asal_sekolah || '')}${k.asal_sekolah ? '<br>' : ''}${tgl(k.created_at)}</div></div><div class="ka"><a class="btn sm y" href="${h(okUrl(k.link))}" target="_blank" rel="noopener noreferrer">${ic('link')}Buka Konten</a>${kOwn(k) ? `<button class="btn sm o" data-act="kEdit" data-id="${k.id}">${ic('edit')}</button><button class="btn sm r" data-act="kDel" data-id="${k.id}">${ic('trash')}</button>` : ''}</div></div>` }).join('');
  return `<div class="gh"><div><small>PORTAL MGMP ${h(S.set.mapel.toUpperCase())}</small><h2>Galeri Konten Pembelajaran</h2><p>Temukan media belajar, bahan ajar, video, E-Book, dan inovasi lain yang dibagikan guru ${h(S.set.mapel)} Kota Bandar Lampung.</p></div><div class="gs2"><div><b>${all.length}</b><span>Konten</span></div><div><b>${kon}</b><span>Kontributor</span></div><div><b>${jn}</b><span>Jenis</span></div></div></div>
  <div class="gb"><input class="in sr" data-filter placeholder="Cari judul, deskripsi, kontributor…">${sel('mapel', 'Semua Mapel', MAPEL.map(m => [m, m === MAPEL[0] ? 'Informatika' : 'KKA']))}${sel('kelas', 'Semua Kelas', KLS.map(c => [c, 'Kelas ' + c]))}<button class="btn y" data-act="kAdd" style="margin-left:auto">${ic('plus')}Bagikan Konten</button></div>
  ${chips}<p class="mu" style="margin:0 0 12px;font-size:12.5px">Menampilkan ${l.length} dari ${all.length} konten</p>
  ${cards ? `<div class="kg">${cards}</div>` : `<div class="cc">${empty(all.length ? 'Tidak ada konten yang sesuai dengan filter.' : 'Belum ada konten. Bagikan konten pertama Anda lewat tombol Bagikan Konten.')}</div>`}`;
};
A.gf = (d, t) => { S.gf[d.k] = t.value; go('galeri') };
A.gj = d => { S.gf.jenis = d.v; go('galeri') };

// ---------- aksi umum ----------
A.go = d => go(d.p);
A.more = () => $('#pop').classList.toggle('on');
A.mclose = () => closeM();
A.role = (d, t) => { $$('.seg button').forEach(b => b.classList.toggle('on', b === t)); $('#rl').value = d.r; $('#ul').textContent = d.r === 'admin' ? (IS_PREVIEW ? 'Username Admin' : 'Email Admin') : 'Username Anggota';
  $('#lt').textContent = d.r === 'admin' ? 'Masuk sebagai Admin' : 'Masuk sebagai Anggota';
  $('#ls').textContent = d.r === 'admin' ? 'Kelola data anggota, pertemuan, konten, dan pengaturan portal.' : 'Lakukan presensi, bagikan konten pembelajaran, dan lihat kartu anggota.';
  $('[name=u]').placeholder = d.r === 'admin' && !IS_PREVIEW ? 'email@sekolah.sch.id' : 'Masukkan username' };
A.eye = (d, t) => { const i = t.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password' };
A.ql = d => login(d.r, d.r === 'admin' ? 'admin' : 'peserta', 'edudigital');
A.logout = async () => {
  if (!await confirmBox({ title: 'Keluar dari Aplikasi?', msg: 'Sesi Anda akan diakhiri. Anda perlu masuk kembali untuk menggunakan aplikasi ini.', ok: 'Ya, Keluar', cancel: 'Batal', icon: 'logout' })) return;
  await busy(async () => { try { if (!IS_PREVIEW && S.role === 'admin') await sb.auth.signOut() } catch { } try { localStorage.removeItem('mgmp_uid') } catch { } }, 'Keluar…');
  stopMedia(); S.user = null; S.role = null; bkOff(); loginView();
};
FM.fl = async f => { const d = fd(f); await login(d.role, d.u, d.p) };

app.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const f = A[t.dataset.act]; if (f) Promise.resolve().then(() => f(t.dataset, t, e)).catch(x => toast(msg(x), 'er')) });
app.addEventListener('submit', e => { e.preventDefault(); const f = FM[e.target.getAttribute('id')]; if (f) busy(() => f(e.target)).catch(x => { snd(0); toast(msg(x), 'er') }) });
app.addEventListener('change', e => { const t = e.target; if (t.dataset.chg) Promise.resolve().then(() => A[t.dataset.chg]?.(t.dataset, t, e)).catch(x => toast(msg(x), 'er')) });
app.addEventListener('input', e => { const t = e.target; if ('filter' in t.dataset) { const q = t.value.toLowerCase(); $$('[data-s]').forEach(r => r.hidden = !r.dataset.s.includes(q)) } });

// ---------- mulai ----------
(async () => {
  try { const s = await DB.list('pengaturan'); if (s[0]) S.set = { ...DEF, ...s[0] } } catch { }
  if (!IS_PREVIEW) {
    try {
      const { data } = await sb.auth.getSession();
      if (data.session) { S.role = 'admin'; S.user = { id: data.session.user.id, email: data.session.user.email }; await busy(loadAll, 'Memuat data…'); return start() }
      const id = localStorage.getItem('mgmp_uid'); if (id) { S.role = 'anggota'; S.user = { id }; await busy(loadAll, 'Memuat data…'); return start() }
    } catch { S.user = null; S.role = null }
  }
  loginView();
})();
</script>

<script src="/pwa.js"></script>
</body>
</html>
